<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易丽萍 · 简牍</title>
  <style>
    /* ---------- 全局基底 ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f2ede6;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
      color: #2e2a28;
      line-height: 1.7;
      padding: 3rem 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* 主纸页——极简版 */
    .paper {
      max-width: 780px;
      width: 100%;
      background: #fffcf8;
      border: 1px solid #e5ded5;
      box-shadow: 0 10px 30px -15px rgba(80, 60, 40, 0.1);
      padding: 3rem 2.8rem;
      position: relative;
    }

    /* ---------- 模块分隔 ---------- */
    .module {
      margin-bottom: 2.8rem;
      position: relative;
    }

    .module-label {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.3rem;
    }

    .module-label .seal-no {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: #c44d3a;
      color: #fff8f0;
      font-size: 0.65rem;
      font-weight: 600;
      border-radius: 2px;
      letter-spacing: 1px;
      user-select: none;
    }

    .module-label .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, #e0d7cf 0%, #f0eae4 60%, transparent 100%);
    }

    /* ---------- 模块一 · 题签 ---------- */
    .title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0.5rem 0 1.5rem;
      position: relative;
    }

    .name {
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #1f1b18;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .name .surname {
      color: #c44d3a;
    }

    .motto {
      font-size: 1rem;
      color: #8a7e72;
      margin-top: 0.5rem;
      letter-spacing: 0.15em;
      border-top: 1px solid #eee8e2;
      border-bottom: 1px solid #eee8e2;
      padding: 0.5rem 1.8rem;
      display: inline-block;
    }

    .motto::before,
    .motto::after {
      content: "·";
      color: #c44d3a;
      margin: 0 0.5rem;
      font-size: 1.4rem;
      line-height: 1;
      vertical-align: middle;
    }

    /* 竖排诗词小字 */
    .verse-note {
      position: absolute;
      right: -1rem;
      top: 0;
      display: flex;
      gap: 0.8rem;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 0.75rem;
      color: #b5a99e;
      letter-spacing: 0.15em;
      line-height: 1.8;
      user-select: none;
    }

    /* ---------- 模块二 · 名帖标签 ---------- */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1rem;
      padding: 0.4rem 0;
      justify-content: center;
    }

    .tag-item {
      font-size: 0.82rem;
      color: #5f554b;
      border: 1px solid #e2d9d0;
      padding: 0.25rem 0.9rem;
      border-radius: 2px;
      background: #fdfaf6;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    /* ---------- 模块三 · 自述 ---------- */
    .quote-block {
      border-left: 3px solid #c44d3a;
      padding: 0.8rem 1.4rem;
      background: #fbf7f3;
      margin-bottom: 1.4rem;
      font-size: 1.05rem;
      color: #3f3833;
      line-height: 1.8;
      font-style: italic;
    }

    .intro-lines {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 0.95rem;
      color: #4f4842;
      padding-left: 0.2rem;
    }

    .intro-lines .sub-note {
      font-size: 0.82rem;
      color: #a89e94;
      margin-top: 0.2rem;
    }

    /* ---------- 模块四 · 递帖 ---------- */
    .connect-block {
      text-align: center;
    }

    .connect-block .invite {
      font-size: 0.95rem;
      color: #5f554b;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }

    .connect-block .invite em {
      font-style: normal;
      color: #c44d3a;
      font-weight: 500;
    }

    .social-row a {
      color: #6b6158;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      border-bottom: 1px dotted #d9cec4;
      padding-bottom: 0.15rem;
    }

    /* ---------- 落款区 ---------- */
    .signature {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 1.2rem;
      margin-top: 1.5rem;
      padding-right: 0.5rem;
    }

    .signature .sign-text {
      text-align: right;
      font-size: 0.78rem;
      color: #8a7e72;
      letter-spacing: 0.12em;
      line-height: 1.9;
    }

    .signature .sign-text .sign-name {
      font-size: 0.88rem;
      color: #5f554b;
    }

    /* 朱文印章 */
    .red-seal {
      width: 52px;
      height: 52px;
      background: #c44d3a;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff8f0;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1;
      box-shadow: 0 2px 5px rgba(150, 50, 30, 0.2);
      flex-shrink: 0;
      user-select: none;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }

    /* ---------- 页脚 ---------- */
    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: #b8ada2;
      letter-spacing: 0.1em;
      border-top: 1px solid #f0eae4;
      padding-top: 1.2rem;
      margin-top: 1.5rem;
    }

    .footer-note .red-dot {
      color: #c44d3a;
      margin: 0 0.3rem;
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 700px) {
      .verse-note {
        position: static;
        writing-mode: horizontal-tb;
        text-align: right;
        margin-top: 1.5rem;
        font-size: 0.7rem;
        color: #b5a99e;
        justify-content: flex-end;
      }
    }

    @media (max-width: 600px) {
      body { padding: 1.5rem 0.8rem; }
      .paper { padding: 2rem 1.4rem; }
      .name { font-size: 2rem; }
      .tag-item { font-size: 0.75rem; padding: 0.2rem 0.6rem; }
      .quote-block { font-size: 0.95rem; padding: 0.7rem 1rem; }
      .signature { gap: 0.8rem; padding-right: 0; }
      .red-seal { width: 46px; height: 46px; font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <main class="paper">

    <!-- ========== 模块一 · 题签 ========== -->
    <section class="module">
      <div class="module-label">
        <span class="seal-no">一</span>
        <span class="line"></span>
      </div>
      
      <div class="title-block">
        <h1 class="name"><span class="surname">易</span>丽萍</h1>
        <div class="motto">不入流，也是流。</div>
        
        <!-- 竖排诗词小字 -->
        <div class="verse-note">
          <span>林花谢了春红，太匆匆。无奈朝来寒雨晚来风。</span>
          <span>胭脂泪，相留醉，几时重。自是人生长恨水长东。</span>
        </div>
      </div>
    </section>

    <!-- ========== 模块二 · 名帖 ========== -->
    <section class="module">
      <div class="module-label">
        <span class="seal-no">二</span>
        <span class="line"></span>
      </div>
      <div class="tag-cloud">
        <span class="tag-item">江西</span>
        <span class="tag-item">高三</span>
        <span class="tag-item">十七岁</span>
        <span class="tag-item">水瓶座</span>
        <span class="tag-item">2月1日</span>
        <span class="tag-item">INFP</span>
        <span class="tag-item">喜欢独立思考，不喜欢随大流</span>
        <span class="tag-item">中文 · 江西方言 · 一点点英语</span>
      </div>
    </section>

    <!-- ========== 模块三 · 自述 ========== -->
    <section class="module">
      <div class="module-label">
        <span class="seal-no">三</span>
        <span class="line"></span>
      </div>
      <div class="quote-block">
        我很难评价自己，所以评论权就交给所有认识我、和看到这个网站的人。
      </div>
      <div class="intro-lines">
        <p>来自江西的高三学生，十七岁，水瓶座。</p>
        <p>朋友不少，也还想认识更多——路过这里的话，欢迎打个招呼。</p>
        <p class="sub-note">嗯，就这样吧。</p>
      </div>
    </section>

    <!-- ========== 模块四 · 递帖 ========== -->
    <section class="module">
      <div class="module-label">
        <span class="seal-no">四</span>
        <span class="line"></span>
      </div>
      <div class="connect-block">
        <p class="invite">如果你也想认识我，<em>写信给我</em>。</p>
        <div class="social-row">
          <a href="mailto:arseeya@outlook.com">arseeya@outlook.com</a>
        </div>
      </div>
    </section>

    <!-- ========== 落款 ========== -->
    <div class="signature">
      <div class="sign-text">
        <div class="sign-name">易丽萍 谨识</div>
        <div>丙午年九月廿一</div>
      </div>
      <div class="red-seal" aria-label="荼絳">荼絳</div>
    </div>

    <!-- ========== 页脚 ========== -->
    <div class="footer-note">
      易丽萍<span class="red-dot">·</span>yiliping.kdns.fr
    </div>

  </main>
</body>
</html>
